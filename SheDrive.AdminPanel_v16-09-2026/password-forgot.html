<!doctype html>
<html lang="ar" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SheDrive</title>
	<!-- Bootstrap File -->
	<link rel="stylesheet" type="text/css" href="css/bootstrap/bootstrap.min.css" >
	<!-- Font Awesome Style Sheet File -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">	
	<!-- Main Style Sheet File -->
	<link href="css/styles.css" rel="stylesheet" type="text/css">
	<!-- Browzer Tab Icon -->
	<link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
</head>

<body>
	
	<div class="container-fluid container-md-width">
		<div class="row">
			<div class="col-xl-6 col-xxl-5 login-start-side">
				<img class="login-logo" src="img/logo.png" alt="">
				<h2>Reset your password</h2>
				<p class="mb-4">Enter your registered email address. We’ll send you a password reset link.</p>
				<form action="">	
					
					<div class="input-group">
						<input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp" placeholder="Enter Rigistred Email">
						<img class="input-icon" src="icons/mail.svg">
					</div><!-- End Input-Group -->
					
					<div class="row">
						<div class="col-sm-6">
							<button type="button" class="btn btn-primary btn-submit d-flex" onClick="location.href='password-new.html'"><i class="fa-regular fa-paper-plane"></i>Send Reset Link</button>
						</div>
						<div class="col-sm-6">
				  			<button type="button" class="btn btn-primary-outline btn-submit d-flex" onClick="location.href='login.html'"><i class="fa-solid fa-chevron-left"></i>Back to Login</button>
						</div>
					</div>
					
					<!--
					<div class="row mt-3">
						<div class="col d-flex gap-2">
							<button type="button" class="btn tertiary-link" disabled>إعادة إرسال الرابط</button>
							<span class="resend-counter"><span>53</span>ثانية</span>
						</div>
					</div>
					-->
<!--
					<div class="buttons-container gap-4">
						<button type="submit" class="btn btn-primary btn-submit d-flex"><i class="fa-regular fa-paper-plane"></i>إرسال رابط إعادة التعيين</button>
						<button type="submit" class="btn btn-primary-outline btn-submit d-flex"><i class="fa-solid fa-chevron-right"></i>العودة لتسجيل الدخول</button>
					</div>
-->
					
				</form><!-- End Form -->
				
			</div><!-- End Col -->
			
			<div class="d-none d-xl-block col-xl-6 col-xxl-7 login-end-side">
				<img src="img/login-slogan.png" alt="">
			</div><!-- End Col -->

		</div><!-- End Row -->
	</div><!-- End Container -->
	
	<script>
		document.addEventListener('DOMContentLoaded', function () {
    		const toggleButton = document.querySelector('#show_hide_password button');
			const passwordInput = document.querySelector('#passwordInput');
    		const toggleIcon = document.querySelector('#showHidePassword');

    		toggleButton.addEventListener('click', function (event) {
        		event.preventDefault();

        		// Toggle the type attribute
        		const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        		passwordInput.setAttribute('type', type);

        		// Toggle the eye icon class
        		if (type === 'text') {
            		toggleIcon.classList.remove('fa-eye');
            		toggleIcon.classList.add('fa-eye-slash');
        		} else {
            		toggleIcon.classList.remove('fa-eye-slash');
            		toggleIcon.classList.add('fa-eye');
        		}
    		});
		});
	</script>
</body>
</html>
