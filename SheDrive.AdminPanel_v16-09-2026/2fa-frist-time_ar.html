<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>شي درايف</title>
	<!-- Bootstrap File -->
	<link rel="stylesheet" type="text/css" href="css/bootstrap/bootstrap.rtl.min.css" >
	<!-- Font Awesome Style Sheet File -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">	
	<!-- Main Style Sheet File -->
	<link href="css/styles-ar.css" rel="stylesheet" type="text/css">
	<!-- Browzer Tab Icon -->
	<link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
</head>

<body>
	
	<div class="container-fluid container-md-width">
		<div class="row">
			<div class="col-xl-6 col-xxl-5 login-start-side">
				<img class="login-logo" src="img/logo.png" alt="">
				
				<form action="">
					<!-- End Two Factor Authentication Container -->
					<div class="authenticator">
						<div class="steps justify-content-center">
							<h3><span class="step">1</span>مسح رمز الإستجابة</h3>
							<p class="text-center">يرجى مسح رمز الاستجابة السريعة، أو نسخ الكود أدناه وإدخاله يدويًا في تطبيق المصادقة الثنائية إذا تعذر عليك مسح الرمز.</p>
							<div class="qr-code"><img src="img/qr-code.png" alt=""></div>
							<div class="code-field">
								<p>X7KQ9-MP2LD-8VY4N-QT6ZR</p>
								<button class="btn btn-light" type="button"><i class="fa-regular fa-copy"></i></button>							
							</div>
							<hr>
							<h3 class=""><span class="step">2</span>تأكيد رمز التحقق</h3>
							<p class="mb-4">أدخل رمز التحقق المكوّن من 6 أرقام الظاهر في تطبيق المصادقة الثنائية لإكمال تأكيد حسابك.</p>
							
						</div>
						<!-- End Steps Container -->
						
						<input class="otp-input" id="num1" type="text" maxlength="1" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
						<input class="otp-input" id="num2" type="text" maxlength="1" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
						<input class="otp-input" id="num3" type="text" maxlength="1" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
						<span class="dash">—</span>
						<input class="otp-input" id="num4" type="text" maxlength="1" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
						<input class="otp-input" id="num5" type="text" maxlength="1" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
						<input class="otp-input" id="num6" type="text" maxlength="1" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
						
					</div>
					<!-- End Two Factor Authentication Container -->
					
					<div class="buttons-container mt-3">
						<button type="button" class="btn btn-primary-gradient btn-submit" onClick="location.href='otp.html'"><i class="fa-regular fa-paper-plane"></i>تأكيد وإرسال</button>
					</div>	
<!--
					<div class="row mt-3">
						<div class="col d-flex gap-2">
							<button type="button" class="btn tertiary-link" disabled>إعادة إرسال الرابط</button>
							<span class="resend-counter"><span>53</span>ثانية</span>
						</div>
					</div>
-->
					
				</form><!-- End Form -->
				
			</div><!-- End Col -->
			
			<div class="d-none d-xl-block col-xl-6 col-xxl-7 login-end-side">
				<img src="img/login-slogan.png" alt="">
			</div><!-- End Col -->

		</div><!-- End Row -->
	</div><!-- End Container -->
	
	
	<!-- //// --* ALL SCRIPTS *-- \\\\ -->
	
	<!-- Show & Hide Eye Password Icon / Script -->
	<script>
		document.addEventListener('DOMContentLoaded', function () {
    		const toggleButton = document.querySelector('#show_hide_password button');
			const passwordInput = document.querySelector('#passwordInput');
    		const toggleIcon = document.querySelector('#showHidePassword');

    		toggleButton.addEventListener('click', function (event) {
        		event.preventDefault();

        		// Toggle the type attribute
        		const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        		passwordInput.setAttribute('type', type);

        		// Toggle the eye icon class
        		if (type === 'text') {
            		toggleIcon.classList.remove('fa-eye');
            		toggleIcon.classList.add('fa-eye-slash');
        		} else {
            		toggleIcon.classList.remove('fa-eye-slash');
            		toggleIcon.classList.add('fa-eye');
        		}
    		});
		});
	</script>
	
	<!-- OTP Jumb To Next Input / Script -->
	<script>
		const inputs = document.querySelectorAll('.otp-input');

		inputs.forEach((input, index) => {
  			input.addEventListener('input', () => {
    			// If there is a value and a next input exists, jump to it
    			if (input.value && index < inputs.length - 1) {
      			inputs[index + 1].focus();
    			}
  			});

  			// Optional: Handle backspace to go back
  			input.addEventListener('keydown', (e) => {
    			if (e.key === 'Backspace' && !input.value && index > 0) {
      				inputs[index - 1].focus();
    			}
  			});
		});
	
	</script>
	
</body>
</html>
