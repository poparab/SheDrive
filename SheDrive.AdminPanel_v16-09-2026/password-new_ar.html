<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>شي درايف</title>
	<!-- Bootstrap File -->
	<link rel="stylesheet" type="text/css" href="css/bootstrap/bootstrap.rtl.min.css" >
	<!-- Font Awesome Style Sheet File -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">	
	<!-- Main Style Sheet File -->
	<link href="css/styles-ar.css" rel="stylesheet" type="text/css">
	<!-- Browzer Tab Icon -->
	<link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
</head>

<body>
	
	<div class="container-fluid container-md-width">
		<div class="row">
			<div class="col-xl-6 col-xxl-5 login-start-side">
				<img class="login-logo" src="img/logo.png" alt="">
				<h2>إنشاء كلمة مرور جديدة ،،،</h2>
				<p class="mb-4">يرجى إدخال كلمة المرور الجديدة لتأمين حسابك والمتابعة إلى لوحة التحكم.</p>
				
				<form action="">	

					<div class="input-group" id="show_hide_password">
						<input class="form-control password" type="password" id="passwordInput" placeholder="إكتب كلمة المرور الجديدة">
						<img class="input-icon" src="icons/lock2.svg">
						<button class="show-hide-icon" type="button" aria-label="Toggle password visibility">
							<i class="fa-regular fa-eye" id="showHidePassword"></i>
						</button>
					</div>

					<div class="input-group" id="show_hide_password2">
						<input class="form-control password" type="password" id="passwordInput2" placeholder="تأكيد كلمة المرور الجديدة">
						<img class="input-icon" src="icons/lock2.svg">
						<button class="show-hide-icon" type="button" aria-label="Toggle password visibility">
							<i class="fa-regular fa-eye" id="showHidePassword2"></i>
						</button>
					</div>
					
					<ul class="password-requirements">
						<li>يجب أن تحتوي على 8 أحرف على الأقل.</li>
						<li>يجب أن تحتوي على حرف كبير وحرف صغير على الأقل.</li>
						<li>يجب أن تحتوي على رمز خاص واحد على الأقل.</li>
						<li>يجب ألا تكون مطابقة لكلمة المرور السابقة.</li>
					</ul>
					
					<button type="button" class="btn btn-primary btn-submit d-flex" onClick="location.href='login_ar.html'"><i class="fa-solid fa-check"></i>حفظ كلمة المرور</button>
					
				</form><!-- End Form -->
				
			</div><!-- End Col -->
			
			<div class="d-none d-xl-block col-xl-6 col-xxl-7 login-end-side">
				<img src="img/login-slogan.png" alt="">
			</div><!-- End Col -->

		</div><!-- End Row -->
	</div><!-- End Container -->
	
	<!-- Show & Hide Eye Function Script -->
	<script>
		// Frist Show Hide Script //
		document.addEventListener('DOMContentLoaded', function () {
    		const toggleButton = document.querySelector('#show_hide_password button');
			const passwordInput = document.querySelector('#passwordInput');
    		const toggleIcon = document.querySelector('#showHidePassword');

    		toggleButton.addEventListener('click', function (event) {
        		event.preventDefault();

        		// Toggle the type attribute
        		const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        		passwordInput.setAttribute('type', type);

        		// Toggle the eye icon class
        		if (type === 'text') {
            		toggleIcon.classList.remove('fa-eye');
            		toggleIcon.classList.add('fa-eye-slash');
        		} else {
            		toggleIcon.classList.remove('fa-eye-slash');
            		toggleIcon.classList.add('fa-eye');
        		}
    		});
		});
		
		// Seecond Show Hide Script //
		document.addEventListener('DOMContentLoaded', function () {
    		const toggleButton = document.querySelector('#show_hide_password2 button');
			const passwordInput = document.querySelector('#passwordInput2');
    		const toggleIcon = document.querySelector('#showHidePassword2');

    		toggleButton.addEventListener('click', function (event) {
        		event.preventDefault();

        		// Toggle the type attribute
        		const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        		passwordInput.setAttribute('type', type);

        		// Toggle the eye icon class
        		if (type === 'text') {
            		toggleIcon.classList.remove('fa-eye');
            		toggleIcon.classList.add('fa-eye-slash');
        		} else {
            		toggleIcon.classList.remove('fa-eye-slash');
            		toggleIcon.classList.add('fa-eye');
        		}
    		});
		});
	</script>
	<!-- Show & Hide Eye Function Script -->
	
</body>
</html>
